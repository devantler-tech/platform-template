# Prod Talos + Hetzner cluster.
# See docs/TEMPLATING.md for the fields a fork of this repo needs to edit.
---
apiVersion: ksail.io/v1alpha1
kind: Cluster
metadata:
  name: prod
spec:
  cluster:
    distributionConfig: talos
    connection:
      context: admin@prod
      timeout: 30m
    distribution: Talos
    provider: Hetzner
    cni: Cilium
    gitOpsEngine: Flux
    # KSail manages the Cluster Autoscaler natively when
    # autoscaler.node.enabled is set. KSail installs, configures, and
    # reconciles the autoscaler — no Flux manifests needed. Initial
    # static node counts still apply on `cluster create`.
    autoscaler:
      node:
        enabled: true
        expander: LeastWaste
        # Whole-cluster ceiling: 3 control planes + 4 static workers + up to
        # 2 autoscaled nodes. Keep it one below the Hetzner server limit
        # (default 10): KSail rejects the config unless one server stays free
        # for the temporary server that builds the Talos snapshot.
        maxNodesTotal: 9
        scaleDownUnneededTime: "10m"
        pools:
          - name: autoscale-small
            serverType: cx23
            location: fsn1
            min: 0
            max: 1
          - name: autoscale-medium
            serverType: cx33
            location: fsn1
            min: 0
            max: 2
    # These components are installed by ksail. There is a known race on
    # Hetzner clusters between ksail's metrics-server install and Flux's
    # kubelet-serving-cert-approver install (required because Talos
    # rotate-server-certificates: true leaves kubelet serving CSRs
    # pending). File upstream in devantler-tech/ksail if this trips
    # bootstrap again.
    certManager: Enabled
    metricsServer: Enabled
    policyEngine: Kyverno
    controlPlanes: 3
    # Baseline workers — guaranteed minimum even if autoscaler is down.
    # Longhorn requires dedicated Hetzner Cloud Volumes on static
    # workers; autoscaler-created nodes are compute-only.
    # The Cluster Autoscaler manages additional workers dynamically.
    # Restored to 4 — unblocked by the kubernetesVersion pin below and the KSail >= 7.23.4 scale-up fix.
    workers: 4
    # Pin Kubernetes deliberately so 'ksail cluster update' doesn't roll nodes
    # to ksail's newer default when that default outruns what the pinned Talos
    # version supports (rejected with "kubelet image is not valid: version of
    # Kubernetes ... is too new"). The Talos v1.13 line supports Kubernetes
    # 1.31-1.36, so bump this in lockstep with the Talos pin below. On a
    # running cluster, upgrade Kubernetes one minor at a time, and never in
    # the same 'ksail cluster update' as a Talos OS upgrade.
    kubernetesVersion: v1.36.4
    talos:
      # Pin the Talos version so 'ksail cluster update' doesn't select ksail's
      # default. KSail builds a Hetzner snapshot of this version and boots
      # every node from it. Keep the installer tag in
      # talos/cluster/install-image.yaml on this same version.
      version: v1.13.11
      # Hetzner Talos ISO (x86_64): boot media for the temporary server that
      # builds the snapshot above, not the version nodes run. The v1.11.2 ISO
      # (122630) was removed from Hetzner on 2026-03-18; 125127 is v1.12.4.
      iso: 125127
      # Talos Image Factory extensions baked into the node image. KSail
      # computes the schematic ID from this list (plus the kernel arguments
      # the talos/ patches set) and uses it both for machine.install.image
      # and for the Hetzner snapshot nodes boot from. It replaces the
      # schematic in talos/cluster/install-image.yaml and keeps only that
      # file's installer tag.
      #   - siderolabs/iscsi-tools      (Longhorn data plane)
      #   - siderolabs/util-linux-tools (Longhorn fstrim)
      #   - siderolabs/qemu-guest-agent (Hetzner Cloud VM integration)
      extensions:
        - siderolabs/iscsi-tools
        - siderolabs/util-linux-tools
        - siderolabs/qemu-guest-agent
    localRegistry:
      registry: "REPLACE_OWNER:${GHCR_TOKEN}@ghcr.io/REPLACE_OWNER/REPLACE_REPO/manifests"
  provider:
    hetzner:
      controlPlaneServerType: cx33
      workerServerType: cx33
      location: fsn1
      networkCidr: 10.0.0.0/16
      placementGroupStrategy: Spread
      fallbackLocations:
        - nbg1
        - hel1
      placementGroupFallbackToNone: true
  workload:
    sourceDirectory: k8s
    kustomizationFile: clusters/prod
    tag: latest
