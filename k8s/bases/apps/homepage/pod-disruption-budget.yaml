apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homepage
  namespace: homepage
spec:
  # maxUnavailable: 1 is the drain-safe PDB pattern (validate-pdb-drain-safe):
  # it keeps the node drainable at any replica count and still bounds disruption
  # to one pod at a time.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/instance: homepage
