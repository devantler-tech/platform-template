apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cluster-heartbeat
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      platform-heartbeat: "true"
  enableDefaultDeny:
    ingress: true
    egress: true
  ingressDeny:
    - {}
  egress:
    - toFQDNs:
        - matchName: ${alertmanager_heartbeat_host:=hc-ping.com}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # DNS is the only other egress path required to resolve the exact endpoint.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: ${alertmanager_heartbeat_host:=hc-ping.com}
