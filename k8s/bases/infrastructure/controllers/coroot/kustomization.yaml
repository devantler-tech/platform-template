apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Default-off staging base. Provider overlays must opt in explicitly. The
# Coroot CR stays in the later infrastructure layer so this operator can
# establish the CRD before Flux server-side dry-runs the custom resource.
resources:
  - namespace.yaml
  - cilium-network-policy-heartbeat.yaml
  - cilium-network-policy.yaml
  - cron-job.yaml
  - secret-heartbeat.yaml
  - helm-repository.yaml
  - helm-release.yaml
  - http-route.yaml
