# Coroot Community Edition has no native OIDC. Keep the public UI behind the
# existing oauth2-proxy boundary: Gateway sends the request to oauth2-proxy,
# which forwards authenticated traffic to auth-proxy, and auth-proxy selects
# Coroot by Host. The explicit Coroot provider profiles are the only consumers
# of this default-off base.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coroot
  namespace: observability
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Coroot
    gethomepage.dev/description: Metrics, logs, traces, profiling, and alerts.
    gethomepage.dev/group: Observability
    gethomepage.dev/pod-selector: app.kubernetes.io/part-of=coroot,app.kubernetes.io/component=coroot
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - observability.${domain}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Auth-Request-Redirect
                value: https://observability.${domain}/
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains; preload
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
