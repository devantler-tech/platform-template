apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  # maxUnavailable: 1 is the drain-safe PDB pattern (validate-pdb-drain-safe):
  # it keeps the node drainable at any replica count and still bounds disruption
  # to one pod at a time. minAvailable: 1 over a single ready replica permits
  # zero voluntary evictions and makes the hosting node undrainable.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/instance: cloudnative-pg
