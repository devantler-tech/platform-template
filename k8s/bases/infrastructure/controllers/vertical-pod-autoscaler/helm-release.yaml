apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
  namespace: vertical-pod-autoscaler
  labels:
    helm.toolkit.fluxcd.io/crds: enabled
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 2m
  timeout: 10m
  test:
    enable: false
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: vertical-pod-autoscaler
  # https://github.com/FairwindsOps/charts/blob/master/stable/vpa/values.yaml
  values:
    recommender:
      replicaCount: ${vpa_recommender_replicas:=1}
      podSecurityContext:
        runAsUser: 65534
        runAsGroup: 65534
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    updater:
      enabled: true
      replicaCount: ${vpa_updater_replicas:=1}
      # min-replicas: the updater skips any workload with fewer live replicas
      # than this (VPA default 2), unless the VPA sets its own
      # updatePolicy.minReplicas. Most workloads here run one replica, and the
      # shared catalog's generated VPAs set no minReplicas, so the cluster-wide
      # floor is 1: a single-replica workload is still right-sized instead of
      # silently never acted on. VPAs that set minReplicas keep their own value.
      extraArgs:
        min-replicas: 1
      podSecurityContext:
        runAsUser: 65534
        runAsGroup: 65534
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
    admissionController:
      replicaCount: ${vpa_admission_replicas:=2}
      podSecurityContext:
        runAsUser: 65534
        runAsGroup: 65534
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      podDisruptionBudget:
        minAvailable: 1
