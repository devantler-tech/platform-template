apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: oauth2-proxy
spec:
  endpointSelector: {}
  # One empty rule per direction names no peer or port, so it allows nothing
  # while activating a valid default-deny floor. Keep this spec identical to
  # the add-default-deny ClusterPolicy output under the same resource name.
  # Other CNPs add the traffic each workload requires.
  ingress:
    - {}
  egress:
    - {}
  enableDefaultDeny:
    ingress: true
    egress: true
