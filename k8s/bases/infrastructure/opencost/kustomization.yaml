---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Coroot-backed OpenCost must be applied in the infrastructure layer beside
# the Coroot custom resource. The operator creates Coroot's Prometheus only
# after that CR exists, so keeping this HelmRelease in the earlier,
# wait-gated controllers layer would deadlock the rollout.
#
# This composition is staged and default-off. Provider activation must remove
# the legacy controller-layer HelmRelease and add this base atomically so Flux
# never has two Kustomizations claiming HelmRelease/opencost/opencost.
resources:
  - ../controllers/opencost/
patches:
  - path: patches/use-coroot-prometheus.yaml
  - target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      name: allow-opencost
      namespace: opencost
    path: patches/use-coroot-network-policy.yaml
