---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
  namespace: opencost
spec:
  dependsOn:
    - name: coroot-operator
      namespace: observability
  values:
    opencost:
      prometheus:
        external:
          url: "http://coroot-prometheus.observability.svc.cluster.local:9090"
      # kube-prometheus-stack leaves during the Coroot cutover, including the
      # Prometheus Operator CRDs. Coroot still scrapes OpenCost's metrics via
      # its node agent, so no ServiceMonitor is needed.
      metrics:
        serviceMonitor:
          enabled: false
