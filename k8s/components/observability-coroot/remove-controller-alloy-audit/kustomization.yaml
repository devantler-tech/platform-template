---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The production Coroot profile forwards Talos audit files directly to Coroot.
# Remove the inherited Loki-only collector there so each audit event has one
# forwarding path; default profiles keep their existing collector unchanged.
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: alloy-audit
      namespace: monitoring
    patch: |
      $patch: delete
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: alloy-audit
        namespace: monitoring
