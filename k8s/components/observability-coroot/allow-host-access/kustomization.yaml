---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Coroot's eBPF node agent and the production audit collector need deliberate
# host access. Keep the exception scoped to the explicit Coroot profiles; the
# default provider payloads retain the stricter observability namespace policy.
patches:
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: add-security-context
    patch: |
      - op: test
        path: /spec/rules/0/exclude/any/0/resources/namespaces/10
        value: velero
      - op: add
        path: /spec/rules/0/exclude/any/0/resources/namespaces/-
        value: observability
      - op: test
        path: /spec/rules/1/exclude/any/0/resources/namespaces/10
        value: velero
      - op: add
        path: /spec/rules/1/exclude/any/0/resources/namespaces/-
        value: observability
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: validate-host-restrictions
    patch: |
      - op: test
        path: /spec/rules/0/exclude/any/0/resources/namespaces/10
        value: velero
      - op: add
        path: /spec/rules/0/exclude/any/0/resources/namespaces/-
        value: observability
      - op: test
        path: /spec/rules/1/exclude/any/0/resources/namespaces/10
        value: velero
      - op: add
        path: /spec/rules/1/exclude/any/0/resources/namespaces/-
        value: observability
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: validate-pod-security
    patch: |
      - op: test
        path: /spec/rules/0/exclude/any/0/resources/namespaces/10
        value: velero
      - op: add
        path: /spec/rules/0/exclude/any/0/resources/namespaces/-
        value: observability
      - op: test
        path: /spec/rules/1/exclude/any/0/resources/namespaces/10
        value: velero
      - op: add
        path: /spec/rules/1/exclude/any/0/resources/namespaces/-
        value: observability
      - op: test
        path: /spec/rules/2/exclude/any/0/resources/namespaces/10
        value: velero
      - op: add
        path: /spec/rules/2/exclude/any/0/resources/namespaces/-
        value: observability
