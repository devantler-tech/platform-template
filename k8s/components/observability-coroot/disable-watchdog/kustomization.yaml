apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The dedicated CronJob owns the Coroot profile's external heartbeat. Disable
# Watchdog there so two independent senders cannot reset the same monitor and
# hide a Prometheus-to-Alertmanager outage. Default profiles keep Watchdog.
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
    patch: |
      - op: test
        path: /spec/values/defaultRules/create
        value: true
      - op: test
        path: /spec/values/defaultRules/disabled/KubeCPUOvercommit
        value: true
      - op: test
        path: /spec/values/alertmanager/config/route/routes/0/receiver
        value: heartbeat
      - op: test
        path: /spec/values/alertmanager/config/receivers/1/name
        value: heartbeat
      - op: test
        path: /spec/values/alertmanager/config/receivers/1/webhook_configs/0/url
        value: ${alertmanager_heartbeat_url:=https://example.invalid/no-heartbeat-configured}
      - op: add
        path: /spec/values/defaultRules/disabled/Watchdog
        value: true
