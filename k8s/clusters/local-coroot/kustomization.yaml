---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local/
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: infrastructure-controllers
      namespace: flux-system
    patch: |
      - op: test
        path: /spec/path
        value: providers/docker/infrastructure/controllers
      - op: replace
        path: /spec/path
        value: providers/docker/infrastructure-controllers-coroot
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: infrastructure
      namespace: flux-system
    patch: |
      - op: test
        path: /spec/path
        value: providers/docker/infrastructure
      - op: replace
        path: /spec/path
        value: providers/docker/infrastructure-coroot
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: apps
      namespace: flux-system
    patch: |
      - op: test
        path: /spec/path
        value: providers/docker/apps
      - op: replace
        path: /spec/path
        value: providers/docker/apps-coroot
