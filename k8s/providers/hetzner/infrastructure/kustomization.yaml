---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../bases/infrastructure/
  - ../../../bases/infrastructure/audit-log-forwarder/
  - cluster-issuers/
  - vault-seed/
patches:
  - path: patches/attach-hcloud-load-balancer.yaml
    target:
      kind: Gateway
      name: platform
  - path: patches/add-webhook-alerting.yaml
    target:
      group: coroot.com
      version: v1
      kind: Coroot
      name: coroot
      namespace: observability
