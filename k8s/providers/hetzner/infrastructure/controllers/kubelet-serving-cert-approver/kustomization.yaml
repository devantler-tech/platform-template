apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Vendored from the upstream v0.12.1 release's deploy/ha-install.yaml
  # (tag commit f72897c68e38185aeca848952d10a094054642ba), one document per
  # file with the upstream bytes unchanged. The HA variant runs 2 replicas with
  # leader election (one active approver plus a warm standby) and a required
  # hostname anti-affinity, so losing a node does not stop kubelet
  # serving-certificate approval. On a version bump, re-vendor every document
  # from the new release tag and update newTag and digest below together.
  - namespace.yaml
  - service-account.yaml
  - role.yaml
  - cluster-role-certificates.yaml
  - cluster-role-events.yaml
  - role-binding-events.yaml
  - role-binding-leader-election.yaml
  - cluster-role-binding.yaml
  - service.yaml
  - deployment.yaml
  - pod-disruption-budget.yaml
  - cilium-network-policy.yaml
# Pin the image by digest here rather than in the vendored deployment.yaml, so
# those bytes stay upstream's. Renders as `:<newTag>@<digest>`; the digest is
# the release's multi-arch image index.
images:
  - name: ghcr.io/alex1989hu/kubelet-serving-cert-approver
    newTag: 0.12.1
    digest: sha256:445a8e5584f659701092d2ec8b625da8929dc75fe4d45274333bd9fe6db8fb75
