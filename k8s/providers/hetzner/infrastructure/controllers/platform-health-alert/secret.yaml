---
# The same Slack webhook Coroot and the Flux notifications post to, so these
# alerts land in the same channel with no new secret to provision. The
# placeholder keeps static validation usable without the decrypted input, and
# the check refuses to deliver to it.
apiVersion: v1
kind: Secret
metadata:
  name: platform-health-alert-webhook
  namespace: observability
type: Opaque
stringData:
  url: ${alertmanager_webhook_url:=https://example.invalid/no-slack-configured}
