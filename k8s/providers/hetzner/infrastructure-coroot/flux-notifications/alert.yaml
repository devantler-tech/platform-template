# Coroot sees workload health, but it cannot observe failed Flux builds,
# applies, dependencies, or readiness waits. Every top-level platform layer is
# a wait-gated Kustomization, so error events cover that complete failure class
# without introducing another polling workload.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: platform-reconciliation
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: "*"
  summary: "Flux reconciliation error — production platform"
