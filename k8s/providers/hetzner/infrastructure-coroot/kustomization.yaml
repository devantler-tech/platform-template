---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../infrastructure/
  - ../../../bases/infrastructure/coroot/
  - ../../../bases/infrastructure/audit-log-forwarder/
  # Coroot observes workloads but cannot see a failed Flux build, apply, or
  # readiness wait. Restore that production safety net through Flux's existing
  # notification controller and the same webhook input Coroot already uses.
  - flux-notifications/
components:
  - ../../../components/observability-coroot/allow-host-access/
  - ../../../components/observability-coroot/isolate-heartbeat/
  - ../../../components/observability-coroot/remove-opencost-references/
patches:
  - path: patches/add-webhook-alerting.yaml
    target:
      group: coroot.com
      version: v1
      kind: Coroot
      name: coroot
      namespace: observability
