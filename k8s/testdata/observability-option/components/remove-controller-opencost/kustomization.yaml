---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Model the future atomic Flux ownership transfer: the earlier controllers
# layer gives up every OpenCost object before the later infrastructure layer
# claims the same identities with the Coroot-backed composition.
patches:
  - target:
      version: v1
      kind: Namespace
      name: opencost
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: opencost
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
      name: opencost
      namespace: opencost
    patch: |
      $patch: delete
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: opencost
        namespace: opencost
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: opencost
      namespace: opencost
    patch: |
      $patch: delete
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: opencost
        namespace: opencost
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: opencost
      namespace: opencost
    patch: |
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: opencost
        namespace: opencost
  - target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      name: allow-opencost
      namespace: opencost
    patch: |
      $patch: delete
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-opencost
        namespace: opencost
