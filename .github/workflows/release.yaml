name: 🎉 Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    # Instances only: each instance cuts releases (and `v*` tags → cd.yaml) of its
    # own cluster repo. The template repo itself ships no release (it is the sync
    # source; downstream instances release independently).
    if: github.repository != 'devantler-tech/platform-template'
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@8ed2071ebe18864b8b86efe0f6b1df8d73d2a6ab # v7.10.4
    with:
      # Skip semantic-release's success/fail hooks, which comment on referenced
      # issues and PRs. A bare `fix #N` meant for another repository otherwise
      # fails the release after the tag and GitHub Release already exist
      # (devantler-tech/actions#610), so no issue or PR write access is needed.
      disable-issue-side-effects: true
    permissions:
      contents: write # create releases and tags
      id-token: write # provenance signing
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
