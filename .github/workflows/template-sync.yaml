name: 🔄 Template Sync

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  template-sync:
    # Skipped in the template repo itself (it is the sync source); runs in every
    # instance created from this template, where it opens a PR with template changes.
    if: github.repository != 'devantler-tech/platform-template'
    # The reusable workflow's job opens the sync PR, so the caller must grant it
    # write to contents + pull-requests. A reusable workflow cannot be granted
    # more than the caller, and the top-level `permissions: {}` grants none, so
    # without this the run fails at startup (reusable-workflow permission check)
    # — both here and in every instance where the job actually runs.
    # id-token: write lets the shared workflow prove its identity to the GitHub
    # token broker (devantler-tech/monorepo ADR 0020) instead of minting from the
    # App key. Granting it is harmless until the workflow asks for it, and it must
    # be here first: a reusable job that asks for more than its caller grants
    # fails at startup.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: devantler-tech/.github/.github/workflows/template-sync.yaml@832e6d37bfd0c0b39c855496efc128d2fdc2be2c # v22.9.0
    with:
      source-repo-path: devantler-tech/platform-template
      # Push with the App token: GITHUB_TOKEN can never update workflow files, so a
      # template change under .github/workflows would otherwise stop the sync. The
      # token comes from the devantler-tech GitHub token broker, which serves only
      # devantler-tech repositories (docs/BOOTSTRAP.md, section 2).
      use-app-token: true
