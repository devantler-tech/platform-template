name: "TODOs"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  todos:
    permissions:
      contents: read # checkout so the scanner can read the source files
      issues: write # open/maintain the tracking issues the scanner manages
    uses: devantler-tech/actions/.github/workflows/scan-for-todo-comments.yaml@84813ae61fb21741e0a6193b5c14c6941a448577 # v9.0.7
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
