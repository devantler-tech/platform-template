name: "TODOs"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  todos:
    permissions:
      contents: read # checkout so the scanner can read the source files
      issues: write # open/maintain the tracking issues the scanner manages
    uses: devantler-tech/actions/.github/workflows/scan-for-todo-comments.yaml@b3783a5148b844b3f1f4011cdc84871ad66348c1 # v13.0.9
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
