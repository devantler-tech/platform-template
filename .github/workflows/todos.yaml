name: "TODOs"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  todos:
    permissions:
      contents: read # checkout so the scanner can read the source files
      issues: write # open/maintain the tracking issues the scanner manages
      id-token: write # lets the shared to-do scanner prove its identity to the GitHub token broker (ADR 0020)
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@f6b200f553bdd94e269c3ee60a93a09c2ad415e4 # v22.5.0
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
