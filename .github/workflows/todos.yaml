name: "TODOs"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  todos:
    permissions:
      contents: read # checkout so the scanner can read the source files
      issues: write # open/maintain the tracking issues the scanner manages
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@d513d0069c20cd8f037c0cb42eadf73268ac14f4 # v14.0.0
    with:
      exclude-vendored: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
