name: "TODOs"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  todos:
    permissions:
      contents: read # checkout so the scanner can read the source files
      issues: write # open/maintain the tracking issues the scanner manages
    uses: devantler-tech/actions/.github/workflows/scan-for-todo-comments.yaml@6ed1f44e8f10e4a87746e99159e30b215b9fe8e6 # v11.0.2
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
