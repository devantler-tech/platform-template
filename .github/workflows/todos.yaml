name: "TODOs"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  todos:
    permissions:
      contents: read # checkout so the scanner can read the source files
      issues: write # open/maintain the tracking issues the scanner manages
    uses: devantler-tech/actions/.github/workflows/scan-for-todo-comments.yaml@0de1d284f879d62d6fe316d3997fd3ea8f092fb3 # v13.2.1
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
