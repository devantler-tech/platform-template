name: "TODOs"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  todos:
    permissions:
      contents: read # checkout so the scanner can read the source files
      issues: write # open/maintain the tracking issues the scanner manages
    uses: devantler-tech/actions/.github/workflows/scan-for-todo-comments.yaml@df7fd4f83edade31c121a9de563d9a7b9b1f900d # v13.10.3
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
