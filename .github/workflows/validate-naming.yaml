name: 🏷️ Validate Naming Conventions

# Instance-side delivery of the naming gate. The template repo runs the gate as
# a REQUIRED job inside ci.yaml — but ci.yaml is instance-owned
# (.templatesyncignore), so template-sync never delivers that job downstream.
# This standalone workflow IS template-synced, so every instance keeps running
# the gate as its ci.yaml diverges. It is skipped in the template repo itself
# to avoid duplicating the required ci.yaml job there.

on:
  pull_request:
    paths:
      - "k8s/**"
      - "talos*/**"
      - ".github/manifest-naming*.yaml"
      - ".github/workflows/validate-naming.yaml"

permissions: {}

jobs:
  validate-naming:
    name: 🏷️ Validate Naming Conventions
    if: github.repository != 'devantler-tech/platform-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏷️ Validate naming conventions
        uses: devantler-tech/actions/validate-naming@a147ead8b8bc937fbfb1974e3698c7e32f95517d # v13.5.1
        with:
          enabled: "true"
          config-file: ${{ hashFiles('.github/manifest-naming.local.yaml') != '' && '.github/manifest-naming.local.yaml' || '.github/manifest-naming.yaml' }}
